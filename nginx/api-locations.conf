# Shared HTTP/HTTPS API routes (the /api prefix is preserved):
# GET /api/health, /api/models, /api/auth/me
# POST /api/auth/register, /api/auth/login, /api/auth/logout
# GET/POST /api/api-keys, /api/provider-configs, /api/admin/config
# GET/POST/DELETE /api/auth/whitelist
# GET/DELETE /api/conversations
# GET /api/conversations/messages
# POST /api/chat/stream (text, images, files, SSE)
location = /api { return 308 /api/; }
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 24m;
}
# Agent provider credentials are internal; do not expose /v1 directly.
location ^~ /v1/ { return 404; }
