# Standalone host-deployment reference. install.sh writes a site file instead
# of replacing the server-wide nginx.conf.
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server {
        listen 80;
        server_name linpro.top www.linpro.top;
        root /opt/protein_space/frontend;
        index index.html;
        include /etc/nginx/snippets/protein-space-api.conf;
        location / { try_files $uri $uri/ /index.html; }
    }
}
