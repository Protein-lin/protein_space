<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <button class="new-chat" id="newChat"><span>＋</span> 新建对话</button>
        <div class="sidebar-title">历史对话</div>
        <div id="conversationList" class="conversation-list"></div>
        <div class="sidebar-bottom">
          <label for="modelSelect">模型</label>
          <select id="modelSelect"></select>
          <div class="connection"><i id="statusDot"></i><span id="statusText">正在连接</span></div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar"><div class="brand"><span class="brand-mark">✧</span> Chat</div><div class="topbar-actions"><a href="#">更新公告 <b>NEW</b></a><button id="adminButton" class="auth-button hidden">配置</button><button id="authButton" class="auth-button">登录</button></div></header>
        <section class="chat-page">
          <div id="welcome" class="welcome">
            <h1>Chat</h1>
            <p>智能对话助手 · 流式交流、模型切换、历史会话</p>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="composer" class="composer">
            <textarea id="prompt" rows="1" placeholder="输入消息，或粘贴图片/request_id..." autocomplete="off"></textarea>
            <button id="sendButton" class="send" type="submit" aria-label="发送">➤</button>
            <div class="composer-hint">按 Enter 发送，Shift+Enter 换行，支持粘贴或上传图片</div>
          </form>
        </section>
      </main>
    </div>
    <div id="authPanel" class="auth-panel hidden"><form id="authForm" class="auth-card"><button type="button" id="closeAuth" class="close-auth">×</button><h2 id="authTitle">登录</h2><input id="authUsername" required minlength="3" placeholder="用户名" /><input id="authPassword" required minlength="8" type="password" placeholder="密码（至少 8 位）" /><input id="authEmail" class="hidden" type="email" placeholder="邮箱（注册时填写）" /><button type="submit" class="auth-submit">继续</button><button type="button" id="toggleAuth" class="auth-toggle">没有账号？注册</button><p id="authMessage"></p></form></div>
    <div id="adminPanel" class="auth-panel hidden"><section class="admin-card"><button type="button" id="closeAdmin" class="close-auth">×</button><h2>系统配置</h2><p id="adminMessage"></p><div id="adminContent"></div></section></div>
    <script src="/auth.js"></script><script src="/app.js"></script><script src="/admin.js"></script>
  </body>
</html>
